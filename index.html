<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manuales de equipos · Biodist</title>
<style>
:root{--az:#1f4e79;--fondo:#eef2f6;--txt:#1b2733;--gris:#5b6b7b;--borde:#d3dbe4;--tarjeta:#fff}
@media (prefers-color-scheme:dark){:root{--fondo:#11161c;--txt:#e6edf3;--gris:#9aa7b4;--borde:#2c3640;--tarjeta:#1a2129}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fondo);color:var(--txt)}
header{background:var(--az);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:14px}
header .lg{height:52px;background:#fff;border-radius:8px;padding:4px 6px}
.qrw{position:relative}
.qrw img{position:absolute;left:50%;top:50%;width:17%;transform:translate(-50%,-50%);background:#fff;padding:3%;border-radius:6%}
.pie a{color:inherit}
.btn.wa{background:#1f8f4e}
.area{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--az);margin:16px 0 0;padding-bottom:4px;border-bottom:2px solid var(--az)}
@media (prefers-color-scheme:dark){.area{color:#8fb8e0;border-color:#8fb8e0}}
a.fila.eq{color:var(--txt);text-decoration:none;font-weight:400}
a.fila.eq b{color:var(--az)}
@media (prefers-color-scheme:dark){a.fila.eq b{color:#8fb8e0}}
.sel textarea{width:100%;font-size:15px;padding:8px;border:1px solid var(--borde);border-radius:8px;background:var(--tarjeta);color:var(--txt);margin:0 0 8px}
.et .s{font-weight:700;line-height:1.1}
header .t1{font-size:13px;opacity:.85;letter-spacing:.5px}
header .t2{font-size:20px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--gris);font-size:14px;margin:0 0 14px}
.btn{display:block;width:100%;text-align:center;background:var(--az);color:#fff;text-decoration:none;font-size:17px;font-weight:600;padding:14px;border-radius:10px;border:0;margin-top:10px;cursor:pointer}
.btn.sec{background:transparent;color:var(--az);border:1px solid var(--az)}
@media (prefers-color-scheme:dark){.btn.sec{color:#8fb8e0;border-color:#8fb8e0}}
input[type=search],select,input[type=number]{font-size:16px;padding:10px;border:1px solid var(--borde);border-radius:8px;background:var(--tarjeta);color:var(--txt)}
input[type=search]{width:100%;margin-bottom:12px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--borde)}
.fila:last-child{border-bottom:0}
.fila a{color:var(--az);font-weight:600;text-decoration:none}
@media (prefers-color-scheme:dark){.fila a{color:#8fb8e0}}
.prox{color:var(--gris);font-size:13px}
.pie{color:var(--gris);font-size:12px;text-align:center;margin:20px 0}
/* Etiquetas */
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.ctl label{font-size:14px}
.sel{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:15px}
.sel span{flex:1}
.sel input[type=number]{width:64px;padding:6px}
#hoja{display:flex;flex-wrap:wrap;gap:0;background:#fff;padding:8px}
.et{border:1px dashed #9aa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#000;background:#fff;padding:2mm;break-inside:avoid;page-break-inside:avoid}
.et svg{display:block}
.et .m{font-weight:800;line-height:1.05;margin-top:1mm}
.et .l{line-height:1.1;color:#222}
@media print{
  @page{size:letter;margin:8mm}
  body{background:#fff}
  header,.noimp{display:none!important}
  main{max-width:none;padding:0}
  #hoja{padding:0}
}
</style>
</head>

    var u="https://"+GC+".goatcounter.com/count?p="+encodeURIComponent(path)+"&t="+encodeURIComponent(titulo||path)+(evento?"&e=true":"")+"&r="+encodeURIComponent(document.referrer||"")+"&s="+[screen.width,screen.height,(window.devicePixelRatio||1)].join(",")+"&rnd="+Math.random().toString(36).slice(2);
    if(window.fetch){fetch(u,{mode:"no-cors",keepalive:true,credentials:"omit"}).catch(function(){});return;}
    (new Image()).src=u;
  }catch(x){}
}
var pie='<div class="pie">Biodist S.A. de C.V. · Manuales de usuario del fabricante</div>';

function limpiaTexto(x){x=String(x||"").toUpperCase().replace(/[^A-Z0-9ÁÉÍÓÚÜÑ .,\-\/#]/g,"").replace(/\s+/g," ").trim();return x.slice(0,90)}
function limpiaSerie(x){x=String(x||"").toUpperCase().replace(/\s+/g,"").replace(/[^A-Z0-9\-\/\.]/g,"");return x.length&&x.length<=24?x:""}
function vistaEquipo(e,ctx){
  if(!e){
    app.innerHTML='<div class="card"><h1>Equipo no encontrado</h1><p class="sub">El código de esta etiqueta no está registrado.</p><a class="btn sec" href="./">Ver todos los equipos</a></div>'+pie;return;
  }
  ctx=ctx||{serie:limpiaSerie(q.get("s")),hosp:limpiaTexto(q.get("h")),area:limpiaTexto(q.get("a"))};
  var serie=ctx.serie||"",hosp=ctx.hosp||"",area=ctx.area||"";
  document.title=e.n+" · Manual";
  var h=(ctx.volver?'<button class="btn sec" id="volver" style="margin:0 0 12px">‹ Volver a los equipos del hospital</button>':'')+'<div class="card"><h1>'+esc(e.n)+'</h1>'+(serie?'<p class="sub" style="margin:0 0 6px">Serie: <b>'+esc(serie)+'</b>'+(hosp?'<br>'+esc(hosp)+(area?' · '+esc(area):''):'')+'</p>':'');
  if(e.d.length){
    h+='<p class="sub">Manuales — toca para abrir:</p>';
    e.d.forEach(function(x,i){h+='<a class="btn" data-i="'+i+'" href="'+esc(x.u)+'">'+esc(x.t)+'</a>'});
  }else{
    h+='<p class="sub">El manual de este equipo aún no está disponible. Consulta a tu técnico de Biodist.</p>';
  }
  h+='</div>';
  var msg="Hola, solicito servicio para el equipo "+e.n+(serie?", serie "+serie:", serie: ")+".\nHospital: "+hosp+"\nÁrea: "+area+"\nFalla: ";
  h+='<div class="card"><h1 style="font-size:19px">¿El equipo falla?</h1><p class="sub">Solicita servicio a Biodist.</p>'+
     '<a class="btn wa" id="wa" href="https://wa.me/'+WA+'?text='+encodeURIComponent(msg)+'">Solicitar servicio por WhatsApp</a>'+
     '<a class="btn sec" id="cat" href="tel:'+CAT+'">Llamar al CAT '+CATTXT+'</a></div>'+pie;
  app.innerHTML=h;window.scrollTo(0,0);
  if(ctx.volver)document.getElementById("volver").onclick=ctx.volver;
  var docPath=function(x){return "/doc/"+e.c+"/"+norm(x.t)};
  app.querySelectorAll("a[data-i]").forEach(function(a){a.addEventListener("click",function(){var x=e.d[+a.getAttribute("data-i")];cuenta(docPath(x),e.n+" · "+x.t,true)})});
  document.getElementById("wa").addEventListener("click",function(){cuenta("/servicio/whatsapp/"+e.c,e.n+" · WhatsApp",true)});
  document.getElementById("cat").addEventListener("click",function(){cuenta("/servicio/cat/"+e.c,e.n+" · Llamada CAT",true)});
}

function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function abreHospital(id){
  var k=(location.hash||"").replace(/^#/,""),blob=HOSP[id];
  function error(t){app.innerHTML='<div class="card"><h1>Código no válido</h1><p class="sub">'+t+'</p></div>'+pie}
  if(!blob)return error("Este hospital no está registrado. Consulta a tu técnico de Biodist.");
  if(!k||!window.crypto||!crypto.subtle)return error("El código está incompleto. Vuelve a escanear el QR con la cámara.");
  var p=blob.split(".");
  crypto.subtle.importKey("raw",b64u(k),"AES-GCM",false,["decrypt"]).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(p[0])},key,b64u(p[1]));
  }).then(function(buf){
    var d=JSON.parse(new TextDecoder().decode(buf));
    cuenta("/hosp/"+id,"Hospital "+id);
    vistaHospital(id,d);
  }).catch(function(){error("No se pudo abrir el código. Vuelve a escanear el QR con la cámara.")});
}
function vistaHospital(id,d){
  var lista=d.e.map(function(x){var m=buscar(x[0]);return {m:m||{c:"otro",n:x[3]||x[0],d:[]},s:x[1],a:x[2]}});
  var y=0;
  function pinta(){
    document.title=d.n+" · Equipos";
    var h='<div class="card"><h1 style="font-size:21px">'+esc(d.n)+'</h1><p class="sub">'+lista.length+' equipo'+(lista.length===1?'':'s')+' Biodist. Toca uno para ver sus manuales o solicitar servicio.</p>'+(lista.length>6?'<input type="search" id="b" placeholder="Buscar equipo, serie o área…" autocomplete="off">':'')+'<div id="l"></div></div>'+pie;
    app.innerHTML=h;
    var b=document.getElementById("b"),l=document.getElementById("l");
    function filtra(){
      var t=b?norm(b.value):"",out="",ult="";
      lista.forEach(function(x,i){
        if(t&&norm(x.m.n+" "+x.s+" "+x.a).indexOf(t)<0)return;
        if(x.a!==ult){out+='<div class="area">'+esc(x.a||"SIN ÁREA")+'</div>';ult=x.a;}
        out+='<a class="fila eq" href="#" data-i="'+i+'"><span><b>'+esc(x.m.n)+'</b><br><span class="prox">S/N '+esc(x.s)+'</span></span><span class="prox">'+(x.m.d.length?x.m.d.length+' doc. ›':'›')+'</span></a>';
      });
      l.innerHTML=out||'<p class="sub">Sin resultados.</p>';
    }
    if(b)b.oninput=filtra;filtra();
    l.addEventListener("click",function(ev){
      var a=ev.target.closest("a[data-i]");if(!a)return;ev.preventDefault();
      var x=lista[+a.getAttribute("data-i")];y=window.scrollY;
      cuenta("/hosp/"+id+"/"+x.m.c,d.n+" · "+x.m.n,true);
      vistaEquipo(x.m,{serie:x.s,hosp:d.n,area:x.a,volver:function(){pinta();window.scrollTo(0,y)}});
    });
  }
  pinta();
}

function vistaLista(){
  var h='<div class="card"><h1>Manuales</h1><p class="sub">Busca tu equipo por modelo.</p><input type="search" id="b" placeholder="Ej. XP-300, cobas, GEM…" autocomplete="off"><div id="l"></div></div>'+pie;
  app.innerHTML=h;
  var b=document.getElementById("b"),l=document.getElementById("l");
  function pinta(){
    var t=norm(b.value),out="";
    M.forEach(function(e){
      if(t&&norm(e.n).indexOf(t)<0)return;
      out+='<div class="fila">'+(e.d.length?'<a href="?e='+e.c+'&ver">'+esc(e.n)+'</a><span class="prox">'+e.d.length+' doc.</span>':'<span>'+esc(e.n)+'</span><span class="prox">Próximamente</span>')+'</div>';
    });
    l.innerHTML=out||'<p class="sub">Sin resultados.</p>';
  }
  b.oninput=pinta;pinta();
}

function qrSvg(texto,nivel){
  var qr=qrcode(0,nivel||"H");qr.addData(texto);qr.make();
  return qr.createSvgTag({cellSize:4,margin:2,scalable:true});
}

function etiqueta(e,sr,mm,hosp,area){
  var qrmm=Math.round(mm*(sr?0.64:0.68));
  var p=new URLSearchParams({e:e.c});if(sr)p.set("s",sr);if(hosp)p.set("h",hosp);if(area)p.set("a",area);
  var svg=qrSvg(BASE+"?"+p.toString(),hosp?"Q":"H");
  return '<div class="et" style="width:'+mm+'mm;height:'+mm+'mm"><div class="qrw" style="width:'+qrmm+'mm;height:'+qrmm+'mm">'+svg.replace('<svg ','<svg width="100%" height="100%" ')+'<img alt="" src="'+ICON+'"></div><div class="m" style="font-size:'+(mm/5)+'pt">'+esc(e.n)+'</div>'+(sr?'<div class="s" style="font-size:'+(mm/6.5)+'pt">S/N '+esc(sr)+'</div>':'')+'<div class="l" style="font-size:'+(mm/7.5)+'pt">Escanea: manual y servicio</div></div>';
}

function vistaEtiquetas(){
  var h='<div class="card noimp"><h1>Etiquetas QR</h1><p class="sub">Marca los equipos. Si escribes series (una por renglón, opcionalmente «SERIE; HOSPITAL; ÁREA») sale una etiqueta por serie y el hospital se llena solo en la solicitud de servicio; si no, pon cuántas etiquetas genéricas quieres. Luego toca Imprimir (en iPhone: Compartir → Imprimir, o guardar como PDF).</p>'+
  '<div class="ctl"><label>Tamaño <select id="tam"><option value="40">4 × 4 cm</option><option value="50" selected>5 × 5 cm</option><option value="60">6 × 6 cm</option></select></label>'+
  '<label><input type="checkbox" id="solo"> Solo con manual</label></div>'+
  '<div class="ctl"><button class="btn sec" style="width:auto;margin:0;padding:8px 12px;font-size:14px" id="todos">Marcar todos</button><button class="btn sec" style="width:auto;margin:0;padding:8px 12px;font-size:14px" id="ninguno">Ninguno</button></div>'+
  '<div id="sl"></div><button class="btn" id="imp">Imprimir</button></div>'+
  '<div class="card noimp"><p class="sub" style="margin:0">Vista previa (las líneas punteadas son guía de corte):</p></div><div id="hoja"></div>';
  app.innerHTML=h;
  var sl=document.getElementById("sl"),hoja=document.getElementById("hoja"),tam=document.getElementById("tam"),solo=document.getElementById("solo");
  var est={};M.forEach(function(e){est[e.c]={on:false,n:1,s:""}});
  function lista(){
    var out="";
    M.forEach(function(e){
      if(solo.checked&&!e.d.length)return;
      var s=est[e.c];
      out+='<div class="sel"><input type="checkbox" data-c="'+e.c+'"'+(s.on?' checked':'')+'><span>'+esc(e.n)+(e.d.length?'':' <span class="prox">(sin manual aún)</span>')+'</span><input type="number" min="1" max="60" value="'+s.n+'" data-n="'+e.c+'"></div>'+(s.on?'<div class="sel" style="border:0;padding:0"><textarea rows="3" data-s="'+e.c+'" placeholder="Series de '+esc(e.n)+' (opcional), una por renglón. Formato: SERIE; HOSPITAL; ÁREA">'+esc(s.s)+'</textarea></div>':'');
    });
    sl.innerHTML=out;
  }
  function preview(){
    var mm=+tam.value,qrmm=Math.round(mm*0.68),out="";
    M.forEach(function(e){
      var s=est[e.c];if(!s.on)return;
      if(solo.checked&&!e.d.length)return;
      var series=s.s.split(/\n/).map(function(l){var c=l.split(/[;\t|]/);return {s:limpiaSerie(c[0]),h:limpiaTexto(c[1]),a:limpiaTexto(c[2])}}).filter(function(x){return x.s});
      if(series.length)series.forEach(function(x){out+=etiqueta(e,x.s,mm,x.h,x.a)});
      else for(var i=0;i<s.n;i++)out+=etiqueta(e,"",mm);
    });
    hoja.innerHTML=out;
  }
  sl.addEventListener("change",function(ev){
    var c=ev.target.getAttribute("data-c"),n=ev.target.getAttribute("data-n"),sc=ev.target.getAttribute("data-s");
    if(sc){est[sc].s=ev.target.value;preview();return;}
    if(c){est[c].on=ev.target.checked;lista();}
    if(n){var v=Math.max(1,Math.min(60,parseInt(ev.target.value,10)||1));est[n].n=v;ev.target.value=v;est[n].on=true;lista();}
    preview();
  });
  sl.addEventListener("input",function(ev){var sc=ev.target.getAttribute("data-s");if(sc){est[sc].s=ev.target.value;preview();}});
  tam.onchange=preview;
  solo.onchange=function(){lista();preview()};
  document.getElementById("todos").onclick=function(){M.forEach(function(e){if(!solo.checked||e.d.length)est[e.c].on=true});lista();preview()};
  document.getElementById("ninguno").onclick=function(){M.forEach(function(e){est[e.c].on=false});lista();preview()};
  document.getElementById("imp").onclick=function(){if(!hoja.innerHTML){alert("Marca al menos un equipo.");return}window.print()};
  lista();preview();
}

if(q.has("etiquetas"))vistaEtiquetas();
else if(q.has("h")&&!q.has("e"))abreHospital(q.get("h"));
else if(q.has("e")){var eq=buscar(q.get("e"));cuenta((q.has("ver")?"/lista/":"/qr/")+(eq?eq.c:"no-encontrado-"+norm(q.get("e"))),eq?eq.n:"Código no encontrado");vistaEquipo(eq);}
else{cuenta("/","Lista de equipos");vistaLista();}
})();
</script>
